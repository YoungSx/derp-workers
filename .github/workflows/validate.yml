name: validate

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validate
  cancel-in-progress: true

jobs:
  deployed-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build server and browser WASM
        run: |
          npm run build:wasm
          GOOS=js GOARCH=wasm go build -trimpath -o cmd/derp-browser-test/derp-browser.wasm ./cmd/derp-browser-test

      - name: Install Chrome
        run: |
          # ubuntu-latest ships Chrome's shared libraries; --install-deps would need root
          npx --yes @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/chrome" > /dev/null
          echo "BROWSER_BIN=$(find "$RUNNER_TEMP/chrome" -type f -name chrome | head -1)" >> "$GITHUB_ENV"

      - name: Deploy temporary worker
        id: deploy
        env:
          DERP_WORKER_NAME: derp-workers-validate
        run: |
          set -o pipefail
          deploy() { npx cf deploy 2>&1 | tee /tmp/deploy.log; }
          # a just-uploaded script can briefly 404 on the beta workers API; retry once
          deploy || deploy
          URL=$(grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev' /tmp/deploy.log | head -1)
          if [ -z "$URL" ]; then echo "no workers.dev URL in deploy output" >&2; exit 1; fi
          echo "CF_DERP_BASE_URL=$URL" >> "$GITHUB_ENV"

      - name: Native client suite
        run: node scripts/test-cloudflare.mjs

      - name: Browser WASM client suite
        run: node scripts/test-browser.mjs

      - name: Delete temporary worker
        if: always() && steps.deploy.outcome == 'success'
        run: npx cf workers delete derp-workers-validate --force
