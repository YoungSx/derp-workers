name: validate

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validate
  cancel-in-progress: true

# Local-only validation: the full protocol suites run against workerd (cf dev).
# No Cloudflare account interaction, no secrets. The deployed-path checks live
# in deploy.yml, which is the only workflow allowed to touch live resources.
jobs:
  local-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build server and browser WASM
        run: |
          npm run build:wasm
          GOOS=js GOARCH=wasm go build -trimpath -o cmd/derp-browser-test/derp-browser.wasm ./cmd/derp-browser-test

      - name: Install Chrome
        run: |
          # ubuntu-latest ships Chrome's shared libraries; --install-deps would need root
          npx --yes @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/chrome" > /dev/null
          echo "BROWSER_BIN=$(find "$RUNNER_TEMP/chrome" -type f -name chrome | head -1)" >> "$GITHUB_ENV"

      - name: Native client suite
        run: npm run test:wasm-worker

      - name: Browser WASM client suite
        run: npm run test:browser
